<!doctype html>
<html lang="pl" class="dark">
<head>
  <meta charset="utf-8">
  <title>Todo Artur</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Todo Artur – prosta lista zadań z kategoriami">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Ustawia motyw zanim Angular wystartuje, żeby nie było "mignięcia" jasnego ekranu. -->
  <script>
    try {
      if (localStorage.getItem('todoartur.theme') === '"light"') {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <app-root></app-root>
</body>
</html>
