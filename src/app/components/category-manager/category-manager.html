<section aria-labelledby="cat-heading" class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
  <h2 id="cat-heading" class="mb-3 font-semibold">Kategorie</h2>

  <ul class="mb-4 divide-y divide-slate-100 dark:divide-slate-800">
    @for (c of taskService.categories(); track c.id) {
      <li class="flex items-center gap-3 py-2">
        <span class="size-3 shrink-0 rounded-full" [class]="colors[c.color].dot"></span>
        <span class="min-w-0 flex-1 truncate">{{ c.name }}</span>
        <span class="text-sm text-slate-500">{{ taskService.taskCountByCategory().get(c.id) ?? 0 }}</span>
        <button
          type="button"
          (click)="taskService.deleteCategory(c.id)"
          [disabled]="!taskService.canDeleteCategory(c.id)"
          [title]="deleteTooltip(c.id)"
          [attr.aria-label]="'Usuń kategorię ' + c.name"
          class="rounded-lg p-1 text-slate-400 hover:bg-rose-50 hover:text-rose-600 disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-slate-400 dark:hover:bg-rose-500/10"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </li>
    }
  </ul>

  <form (ngSubmit)="add()" class="space-y-3">
    <div class="flex gap-2">
      <input
        name="name"
        [(ngModel)]="name"
        (ngModelChange)="error.set(null)"
        placeholder="Nowa kategoria"
        maxlength="30"
        aria-label="Nazwa nowej kategorii"
        class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 dark:border-slate-700 dark:bg-slate-950"
      />
      <button
        type="submit"
        [disabled]="!name().trim()"
        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-500 disabled:opacity-40"
      >
        Dodaj
      </button>
    </div>

    <fieldset class="flex flex-wrap gap-2">
      <legend class="sr-only">Kolor</legend>
      @for (name of colorNames; track name) {
        <label class="cursor-pointer" [title]="colors[name].label">
          <input type="radio" name="color" class="peer sr-only" [value]="name" [checked]="color() === name" (change)="color.set(name)" />
          <span
            class="block size-7 rounded-full ring-offset-2 ring-offset-white peer-checked:ring-2 peer-checked:ring-blue-500 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-400 dark:ring-offset-slate-900"
            [class]="colors[name].dot"
          ></span>
          <span class="sr-only">{{ colors[name].label }}</span>
        </label>
      }
    </fieldset>

    @if (error()) {
      <p class="text-sm text-rose-600 dark:text-rose-400" role="alert">{{ error() }}</p>
    }
  </form>
</section>
