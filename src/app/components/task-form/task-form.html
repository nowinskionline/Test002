<form (ngSubmit)="submit()" class="flex flex-col gap-2 sm:flex-row">
  <label for="new-task" class="sr-only">Nowe zadanie</label>
  <input
    id="new-task"
    name="title"
    [(ngModel)]="title"
    placeholder="Co masz do zrobienia?"
    maxlength="200"
    autocomplete="off"
    class="min-w-0 flex-1 rounded-xl border border-zinc-300 bg-white px-4 py-3 outline-none placeholder:text-zinc-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-zinc-700 dark:bg-zinc-900"
  />
  <div class="flex gap-2">
    <select
      name="category"
      [(ngModel)]="categoryId"
      aria-label="Kategoria"
      class="min-w-0 flex-1 rounded-xl border border-zinc-300 bg-white px-3 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 sm:flex-none dark:border-zinc-700 dark:bg-zinc-900"
    >
      @for (category of categories(); track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
    <button
      type="submit"
      [disabled]="!title().trim()"
      class="rounded-xl bg-indigo-600 px-5 py-3 font-medium text-white transition hover:bg-indigo-500 focus-visible:ring-2 focus-visible:ring-indigo-400 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
    >
      Dodaj
    </button>
  </div>
</form>
