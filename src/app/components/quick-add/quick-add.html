<form (ngSubmit)="submit()" class="flex flex-col gap-1">
  <label for="quick-add" class="sr-only">Szybki wrzut – sam tytuł, Enter dodaje</label>
  <input
    id="quick-add"
    name="quickTitle"
    [(ngModel)]="title"
    (ngModelChange)="notice.set(null)"
    placeholder="Szybki wrzut: wpisz myśl i naciśnij Enter"
    autocomplete="off"
    enterkeyhint="done"
    aria-describedby="quick-add-notice"
    class="w-full rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-2.5 text-sm outline-none placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/30 dark:border-slate-700 dark:bg-slate-900/50 dark:focus:bg-slate-900"
  />
  @if (notice()) {
    <p id="quick-add-notice" class="text-xs text-amber-700 dark:text-amber-300" role="status">
      {{ notice() }}
    </p>
  }
</form>
