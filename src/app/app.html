<main class="mx-auto flex max-w-2xl flex-col gap-6 px-4 py-8 sm:py-12">
  <header class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">
        Todo Artur <span class="align-middle text-sm font-medium text-slate-400 dark:text-slate-500">{{ version }}</span>
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Do zrobienia: {{ taskService.activeCount() }} · Ukończone: {{ taskService.completedCount() }}
      </p>
    </div>
    <button
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Włącz jasny motyw' : 'Włącz ciemny motyw'"
      class="rounded-xl border border-slate-200 p-2.5 text-slate-600 hover:bg-slate-100 dark:border-slate-800 dark:text-slate-300 dark:hover:bg-slate-900"
    >
      @if (theme.theme() === 'dark') {
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        </svg>
      }
    </button>
  </header>

  <app-task-form [categories]="taskService.categories()" (added)="taskService.addTask($event.title, $event.categoryId)" />

  <nav aria-label="Filtr kategorii" class="flex flex-wrap items-center gap-2">
    <button
      type="button"
      (click)="setFilter(null)"
      [attr.aria-pressed]="filter() === null"
      class="rounded-full px-3 py-1 text-sm font-medium transition"
      [class]="filter() === null ? 'bg-blue-600 text-white' : 'bg-slate-200/70 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700'"
    >
      Wszystkie
    </button>
    @for (c of taskService.categories(); track c.id) {
      <button
        type="button"
        (click)="setFilter(c.id)"
        [attr.aria-pressed]="filter() === c.id"
        class="flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium transition"
        [class]="filter() === c.id ? 'bg-blue-600 text-white' : 'bg-slate-200/70 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700'"
      >
        <span class="size-2 rounded-full" [class]="colors[c.color].dot"></span>
        {{ c.name }}
      </button>
    }
    <button
      type="button"
      (click)="showCategories.set(!showCategories())"
      [attr.aria-expanded]="showCategories()"
      class="ml-auto rounded-full px-3 py-1 text-sm text-slate-500 hover:bg-slate-200/70 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
    >
      {{ showCategories() ? 'Zamknij' : 'Zarządzaj kategoriami' }}
    </button>
  </nav>

  @if (showCategories()) {
    <app-category-manager />
  }

  <app-task-list [categoryFilter]="filter()" />

  <p class="text-center text-xs text-slate-400 dark:text-slate-600">
    Dwuklik na zadaniu = edycja · Przeciągnij za uchwyt, aby zmienić kolejność
  </p>
</main>

<app-toast />
